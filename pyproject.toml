[project]
name = "linkedin-bot"
version = "0.2.0"
description = "Automação de publicações no LinkedIn via LinkedIn REST Posts API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.4",
]

[project.scripts]
linkedin-bot = "linkedin_bot.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_bot"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
